name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # tag 推送时要把 zip 挂到 Release，默认 token 只有只读权限，必须显式声明
    permissions:
      contents: write
    env:
      # 让 Python 在任何控制台代码页下都用 UTF-8 输出，避免中文/日文 print 把 CI 弄崩
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      # 只验能离线验的东西：导入、语法库、生词库、配置默认值。
      # 真实 OCR 需要日语语言包、翻译需要 API Key，都在 CI 里跳过。
      - name: 自检（导入 + 语法库 + 生词库 + 配置）
        run: python ci_selfcheck.py

      - name: 打包 exe
        run: cmd /c build.bat

      - name: 组装发布包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Select-String -Path "galtl/__init__.py" -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $ver) { throw "读不到 galtl/__init__.py 里的 __version__" }
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF -replace "refs/tags/v", "" }
          Write-Host "version = $ver"

          $exe = "dist/GalgameJP.exe"
          if (-not (Test-Path $exe)) { throw "打包产物不存在: $exe（看上一阶段 build.bat 的输出）" }

          $dir = "release/galgame-jp-helper-v$ver-win64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $exe (Join-Path $dir "galgame日语助手.exe")   # 发布包里给中文名
          Copy-Item "使用说明.txt" $dir
          Copy-Item "LICENSE" $dir

          $zip = "release/galgame-jp-helper-v$ver-win64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $dir | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 2) } } | Format-Table -AutoSize
          "zip = {0:N2} MB" -f ((Get-Item $zip).Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: galgame-jp-helper-win64
          path: release/*.zip
          if-no-files-found: error

      # Release 说明直接取 CHANGELOG.md 里对应版本的那一节。
      # 以前用 `body_path: 使用说明.txt`，结果每个版本的 Release 正文都是同一份使用说明，
      # 更新日志在 GitHub 上永远看不到。
      - name: 生成 Release 说明（取 CHANGELOG 对应小节）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:VERSION
          $lines = Get-Content "CHANGELOG.md" -Encoding UTF8
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "^##\s+v?$([regex]::Escape($ver))(\s|—|–|$)") {
              $start = $i
              continue
            }
            if ($start -ge 0 -and $lines[$i] -match "^##\s+v?\d+\.\d+\.\d+") {
              $end = $i
              break
            }
          }
          if ($start -lt 0) {
            $body = "## v$ver`n`n这一版的具体改动见 CHANGELOG.md。"
            $title = "v$ver"
          } else {
            $head = $lines[$start]
            $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
            $title = if ($head -match "—\s*(.+)$") { "v$ver — $($Matches[1].Trim())" } else { "v$ver" }
          }
          $repo = "${{ github.repository }}"
          $footer = "`n`n---`n`n**下载**：解压 ``galgame-jp-helper-v$ver-win64.zip``，双击 ``galgame日语助手.exe``（不用装 Python）。`n**第一次用**：**F7** 框住对话框文字区，**F8** 开自动翻译。`n**完整更新日志**：https://github.com/$repo/blob/main/CHANGELOG.md"
          Set-Content -Path "release/notes.md" -Value ($body + $footer) -Encoding UTF8
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "notes.md = {0} 字符" -f ($body + $footer).Length

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          body_path: release/notes.md
          name: ${{ env.TITLE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
